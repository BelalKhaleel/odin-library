<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <form>
        <fieldset>
          <legend>Add a new book</legend>
          <div class="title">
            <label for="title">Title: <span class="required">*</span></label>
            <input
              type="text"
              name="title"
              id="title"
              minlength="3"
              maxlength="50"
              required
            />
          </div>
          <div class="author">
            <label for="author">Author: <span class="required">*</span></label>
            <input
              type="text"
              name="author"
              id="author"
              minlength="3"
              maxlength="50"
              required
            />
          </div>
          <div class="pages">
            <label for="pages">Pages: <span class="required">*</span></label>
            <input
              type="number"
              name="pages"
              id="pages"
              min="1"
              max="5000"
              required
            />
          </div>
          <div class="read">
            <label for="read">Read: </label>
            <input type="checkbox" name="read" id="read" />
          </div>
          <button type="submit">Add new book</button>
        </fieldset>
      </form>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </body>
</html>
